# x- prefix defines custom extension field. &backend-config defines YAML anchor (config template)
x-backend-config: &backend-config
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment:
    - DB_HOST=mariadb
    - DB_PORT=3306
    - DB_USER=trellix
    - DB_PASSWORD=trellix
    - DB_NAME=trellix
  depends_on:
    mariadb:
      condition: service_started
    db-init:
      condition: service_completed_successfully
  volumes:
    - ./backend:/app
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
      - frontend

  backend1:
    # << merges all fields from template anchor (* references alias)
    <<: *backend-config

  backend2:
    <<: *backend-config

  backend3:
    <<: *backend-config

  db-init:
    <<: *backend-config
    command: python -m app.db_init
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:10.5
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=trellix
      - MYSQL_USER=trellix
      - MYSQL_PASSWORD=trellix
    volumes:
      - mariadb_data:/var/lib/mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost/api/v1
    volumes:
      - ./frontend:/app
    depends_on:
      - backend1
      - backend2
      - backend3

volumes:
  mariadb_data: