services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
      - frontend

  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=trellix
      - DB_PASSWORD=trellix
      - DB_NAME=trellix
    depends_on:
      - mariadb
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=trellix
      - DB_PASSWORD=trellix
      - DB_NAME=trellix
    depends_on:
      - mariadb
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  backend3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=trellix
      - DB_PASSWORD=trellix
      - DB_NAME=trellix
    depends_on:
      - mariadb
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  mariadb:
    image: mariadb:10.5
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=trellix
      - MYSQL_USER=trellix
      - MYSQL_PASSWORD=trellix
    volumes:
      - mariadb_data:/var/lib/mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost/api/v1
    volumes:
      - ./frontend:/app
      # node_modules lives ONLY in the Docker image.
      # To add packages:
      #   1. npm install locally (updates package.json + package-lock.json)
      #   2. git commit
      #   3. docker compose rm -f frontend && docker compose up -d --build frontend
    depends_on:
      - backend1
      - backend2
      - backend3

volumes:
  mariadb_data: